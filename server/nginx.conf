# Эталонный nginx-конфиг для v-sharypova.ru
# Расположение на сервере: /etc/nginx/sites-available/v-sharypova.ru
#
# ВАЖНО: перед применением убедиться, что SSL-сертификат уже выпущен:
#   certbot --nginx -d v-sharypova.ru -d www.v-sharypova.ru
#
# Деплой:
#   scp server/nginx.conf root@VPS:/etc/nginx/sites-available/v-sharypova.ru
#   ln -sf /etc/nginx/sites-available/v-sharypova.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name v-sharypova.ru www.v-sharypova.ru;

    # Публичная директория — только статика
    root  /var/www/v-sharypova.ru/public;
    index index.html;

    # ── Блокировки ────────────────────────────────────────────────────────

    # Dotfiles (.env, .git, .htaccess и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Backend-директория
    location ^~ /server {
        deny all;
    }

    # Директория с диалогами клиентов
    location ^~ /data {
        deny all;
    }

    # Env-файлы и JSON-файлы по прямому URL
    location ~* \.(env|json)$ {
        deny all;
    }

    # PHP (send.php и любые другие)
    location ~* \.php$ {
        deny all;
    }

    # ── API контакт-формы (v-sharypova-api :3001) ─────────────────────────

    location = /api/send {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 15s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3001;
    }

    # ── Telegram webhook (v-sharypova-bot :3002) ──────────────────────────

    location = /api/bot {
        proxy_pass         http://127.0.0.1:3002;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /api/bot/health {
        proxy_pass http://127.0.0.1:3002;
    }

    # ── Статические файлы ─────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ =404;

        add_header X-Content-Type-Options        "nosniff"                          always;
        add_header X-Frame-Options               "SAMEORIGIN"                       always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name v-sharypova.ru www.v-sharypova.ru;
    return 301 https://$host$request_uri;
}
